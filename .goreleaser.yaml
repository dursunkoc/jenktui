# Release builds are produced by .github/workflows/release.yml when a v* tag is
# pushed. Try it locally without publishing anything:
#   goreleaser release --snapshot --clean
version: 2

project_name: jenktui

builds:
  - id: jenktui
    main: .
    binary: jenktui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/dursunkoc/jenktui/internal/version.Version={{ .Version }}
      - -X github.com/dursunkoc/jenktui/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/dursunkoc/jenktui/internal/version.Date={{ .Date }}

archives:
  - id: jenktui
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # Tags with a suffix such as v0.2.0-rc1 are marked as pre-releases; v0.1.0 is not.
  prerelease: auto

# Publishes a Homebrew formula (prebuilt binaries, macOS and Linux) to
# github.com/dursunkoc/homebrew-tap on each release:
#   brew install dursunkoc/tap/jenktui
# goreleaser marks `brews` deprecated in favour of casks, but a formula also
# works on Linux and needs no quarantine workaround.
brews:
  - name: jenktui
    repository:
      owner: dursunkoc
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/dursunkoc/jenktui
    description: Terminal UI for Jenkins
    license: MIT
    test: |
      assert_match "jenktui", shell_output("#{bin}/jenktui --version")
